<!DOCTYPE html>
<html>
<head>
    <title>ComicCraft AI</title>
    <style>
        body { font-family: sans-serif; background: #111; color: white; text-align: center; padding: 50px; }
        h1 { color: #ff6b6b; font-size: 50px; }
        .box { background: #222; padding: 30px; border-radius: 20px; max-width: 600px; margin: auto; }
        input, select, textarea { width: 90%; padding: 12px; margin: 8px; border-radius: 8px; border: none; }
        button { background: #ff6b6b; color: white; padding: 15px 40px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>ComicCraft AI 🎨</h1>
    <div class="box">
        <h2>Website WORKING!</h2>
        <p>Next: Comic generate pannalam</p>
        <form action="/generate" method="post">
            <input name="character_name" placeholder="Character Name" required><br>
            <input name="setting" placeholder="Setting" required><br>
            <input name="tone" placeholder="Tone (funny, dark)" required><br>
            <input name="art_style" placeholder="Art Style" required><br>
            <textarea name="story_prompt" placeholder="Story idea" required></textarea><br>
            <button type="submit">Generate Comic</button>
        </form>
    </div>
</body>
</html>
